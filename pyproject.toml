[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figkit"
version = "0.1.0"
description = "Publication-quality matplotlib figures for systems and ML papers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/USERNAME/figure-draw-template"

[tool.setuptools]
packages = ["figkit"]
